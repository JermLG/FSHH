<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Dive - Underwater Survival</title>
    <style>
        @font-face {
            font-family: 'BoldPixels';
            src: url('fonts/BoldPixels.otf') format('opentype'),
                 url('fonts/BoldPixels.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a1a;
            overflow: hidden;
        }

        #gameCanvas {
            border: 2px solid #1a3a5c;
            box-shadow: 0 0 20px rgba(0, 100, 200, 0.3);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #88ccff;
            font-family: 'BoldPixels', 'Courier New', monospace;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.5);
        }

        #depth {
            color: #111111;
            background: rgba(200, 220, 240, 0.7);
            padding: 2px 8px;
            border-radius: 4px;
            text-shadow: none;
            margin-top: 4px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #5588aa;
            font-family: 'BoldPixels', 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="health">Health: 100</div>
        <div id="depth">Depth: 0m</div>
        <div id="dashStatus">Dash: Ready</div>
    </div>
    <div id="controls">
        WASD/Arrows: Move | SPACE: Dash | M: Mute
    </div>
    <script src="game.js"></script>
</body>
</html>
